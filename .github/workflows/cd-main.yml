name: CD - Main Branch (Production)

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci-developer.yml

  build-and-push:
    name: Build and Push to GHCR
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD'}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: Verify image
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
          docker inspect ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy-notification:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: build-and-push
    if: success()

    steps:
      - name: Send deployment notification
        run: |
          echo "Image deployed: ghcr.io/${{ github.repository }}:${{ github.sha }}"
          echo "Tags: latest, ${{ github.sha }}"

      # Add webhook/notification step here for your deployment system