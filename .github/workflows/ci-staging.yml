name: CI - Staging Branch

on:
  push:
    branches: [staging]

jobs:
  test:
    name: Test
    uses: ./.github/workflows/ci-developer.yml

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: |
            marketing-notification-platform:staging
            marketing-notification-platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image health
        run: |
          docker run -d --name test-app \
            -e APP_ENV=staging \
            -e ELASTICSEARCH_HOST=http://host.docker.internal:9200 \
            -e ELASTICSEARCH_PASSWORD=changeme \
            -p 8000:8000 \
            marketing-notification-platform:staging

          # Wait for startup
          sleep 15

          # Health check
          curl -f http://localhost:8000/health || exit 1

          docker stop test-app
          docker rm test-app